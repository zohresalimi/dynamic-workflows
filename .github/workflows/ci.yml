# CI (docs/14-testing-strategy.md §14, NF4/NF5).
#
# Four jobs. `check` is the fast, single-platform gate. `test` is the only
# thing here that costs real time on a push, and it is a four-leg matrix because
# macOS and Linux are the two platforms NF5 promises and Node 24 (Active LTS
# floor, D2) and 26 (Current) are the two runtimes. `browser-e2e` is Linux only.
# `verify-install` is the release gate (KAR-18.6): it installs the packed
# tarball into a clean room on both platforms, and runs on tags and on demand
# rather than on every push.
#
# Two 2026 footguns are enforced by guard tests rather than by comments alone —
# see test/ci-workflow.test.ts:
#
#   * Corepack is never enabled here. It was removed from Node 25+
#     distributions (TSC vote, March 2025) and is bundled only through Node 24,
#     so it would work on the `24` legs and fail outright on the `26` ones.
#     pnpm/action-setup installs pnpm; "packageManager" is still read as a
#     version assertion. (The guard greps this file for the literal command,
#     which is why the phrase does not appear even in a comment: a commented-out
#     step is one keystroke from being a live one.)
#   * Runner images are never the floating aliases. The macOS alias migrated to
#     macOS 26 on Apple Silicon between 8 and 15 June 2026; an implicit
#     architecture change shifts native module prebuilds, node-pty behaviour and
#     filesystem case-sensitivity at once, and it lands without a commit.
#
# Action pins were checked against the marketplace on 2026-08-04 (the epic's own
# "Unverified" item); what was found, and why the newer majors are not taken
# yet, is recorded in docs/CONTRIBUTING.md.

name: ci

on:
  push:
  pull_request:
  # KAR-18.6 AC6's second trigger: the clean-room install verification is run
  # "once per milestone even without a release" (docs/03-local-development.md
  # §10), and a milestone is not a git ref. Without this the only way to run it
  # on hosted runners would be to cut a tag you did not want.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm oxlint --type-aware
      # KAR-16.6 AC1. oxlint sees only the <script> block of an SFC, and every
      # file at risk of reaching past the graph facade is one — so the rule that
      # keeps `GraphCanvas.vue` the single importer of @vue-flow/core is its own
      # script rather than a lint config entry that would be inert here.
      - run: pnpm lint:graph-facade
      - run: pnpm typecheck
      # KAR-02.8 AC2: the emitted JSON Schemas under schemas/ are regenerated
      # from the Zod source and compared by content. It belongs here and not in
      # a pre-commit hook — it loads the whole domain package, and
      # docs/14-testing-strategy.md §14.1 keeps that hook under ~2 seconds.
      - run: pnpm schemas:check
      # KAR-18.5 AC4. The release gate: the real build (SPA -> copy -> tsdown)
      # followed by publint and attw against the packed artefact. It is here
      # rather than in the `test` matrix because that matrix is held back behind
      # RUN_TESTS_IN_CI, and a release gate nobody runs is not a gate.
      #
      # It is also the only step in this job that proves the tarball builds at
      # all — typechecking a workspace that resolves @DeFlow/* to live source
      # says nothing about whether they inline, and the failures this catches
      # (a lost `files` entry, an unresolvable exports map, a @DeFlow/* specifier
      # that survived) are invisible until somebody installs the package.
      - run: pnpm pack:check

  test:
    # HELD BACK (owner's decision, 2026-08-05): no tests run in CI for now.
    # They still run locally and in every epic gate before anything merges.
    # Turn back on by setting the repository variable RUN_TESTS_IN_CI to
    # "true" (Settings -> Secrets and variables -> Actions -> Variables),
    # or by deleting this line.
    if: vars.RUN_TESTS_IN_CI == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing leg must not cancel the other three. With fail-fast on, a
      # macOS-only bug and a repo-wide bug produce the same checks list.
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The two environment variables belong on this step and not on the job,
      # even though every step in the job would happily read them: `runner.*`
      # does not exist until a runner has been assigned, which is *after* the
      # job header is evaluated, so `env:` one level up makes GitHub reject the
      # whole file — a run with zero jobs and no logs, not a red job. Measured:
      # run 30913790575. checkJobLevelContexts in test/support/guards.ts holds
      # the line; test/ci-workflow.test.ts runs it over this file.
      - run: pnpm vitest run --project unit --project integration
        env:
          # Keep the tmpdirs the fixtures create, so the upload step below has
          # something to collect. Locally this is opt-in; in CI it is the only
          # way a worktree failure on a platform you do not own is diagnosable.
          DeFlow_KEEP_TMP: "1"
          # os.tmpdir() is /tmp on the Linux runners and /var/folders/…/T on the
          # macOS ones. Pinning TMPDIR is what makes one upload path correct on
          # all four legs — upload-artifact treats "no files matched" as a
          # warning, so without this the macOS legs would fail and upload
          # nothing, silently. test/integration/ci-artifact-path.test.ts holds
          # the path and the fixture to the same glob.
          TMPDIR: ${{ runner.temp }}
      # The fifth vitest project: the SIGKILL/restart slice. KAR-03.8 filled the
      # slot vitest.config.ts was holding (ledger crash/restart) and KAR-06.9
      # added the daemon half (orchestrator crash recovery), so the project is
      # real and this step runs it — EPIC-06's Definition of Done is that the
      # crash-fuzz suite is green in CI, not just on a laptop.
      #
      # Its own step, not another --project on the line above, for two reasons:
      # the slice is serialised and measured in minutes rather than seconds, so
      # folding it in hides which half of the job the wall clock went to, and it
      # is the step whose failure you will actually want the uploaded tmpdir
      # for.
      #
      # The kill point is randomised and seeded from $GITHUB_RUN_ID, which the
      # runner sets for us (packages/testkit/src/random.ts) — so a red leg
      # reproduces locally from the seed it prints. The mock agents are pinned
      # by --seed inside the harness, leaving where the knife lands as the only
      # variable.
      - run: pnpm vitest run --project crash-fuzz
        env:
          # Same two as above, and for the same reasons — a crash-fuzz failure
          # is the case where a ledger you cannot open is the difference between
          # a diagnosis and a shrug.
          DeFlow_KEEP_TMP: "1"
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Per matrix cell: two legs uploading under one name is one leg losing
          # its evidence, and it is the failing leg you will want.
          name: tmp-${{ matrix.os }}-${{ matrix.node }}
          path: ${{ runner.temp }}/DeFlow-*
          if-no-files-found: warn
          retention-days: 7

  verify-install:
    # KAR-18.6 AC6, AC7 — the release gate: `pnpm pack` and then the *real*
    # tarball installed by npx into a `mktemp -d` clean room with no
    # node_modules above it, on both platforms NF5 promises. `pnpm build`
    # producing a green local run proves nothing about the tarball
    # (docs/03-local-development.md §10), and neither does a green `check`:
    # publint and attw read a package's metadata, they never install it.
    #
    # Two things about its placement are deliberate.
    #
    # It is **not** behind `vars.RUN_TESTS_IN_CI`, which holds back the `test`
    # and `browser-e2e` jobs. Same reason `pnpm pack:check` sits in `check`: a
    # release gate nobody runs is not a gate, and the failures this one catches
    # (a `files` array that dropped `dist/ui`, an `@DeFlow/*` specifier that did
    # not inline, a native dependency that reaches for node-gyp on a runner
    # image you do not own) are invisible until somebody installs the package.
    #
    # It is also **not** on every push. The `if` below restricts it to a release
    # tag — AC6's "for every release tag" — and to a manual dispatch, which is
    # how "run it once per milestone even without a release" is triggered. So it
    # costs nothing on an ordinary push and cannot slow the push loop AC12
    # budgets, while still being the thing that runs when a release is cut.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      # Same reasoning as the test matrix, and it bites harder here: the two
      # native dependencies resolve a *different prebuild* per platform
      # (better-sqlite3's prebuilds/, @lydell/node-pty's per-platform
      # optionalDependency), so cancelling the macOS leg because Linux failed
      # discards the only leg that could have told you which of the two it was.
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:install
        env:
          # AC7. The verifier removes its clean room on a green run and keeps
          # it on a red one; this makes the keep explicit rather than implied,
          # so the upload below always has the room a failure left behind.
          DeFlow_KEEP_TMP: "1"
          # The same macOS trap the test job documents: os.tmpdir() is
          # /var/folders/…/T there and /tmp on Linux, so a fixed path would
          # match nothing on exactly one leg — silently, because
          # upload-artifact treats an empty match as a warning.
          # test/integration/ci-artifact-path.test.ts globs this path against
          # a real clean room.
          TMPDIR: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Per leg: the failing platform is the one whose clean room you want,
          # and two legs uploading under one name is one of them losing it.
          name: clean-room-${{ matrix.os }}
          path: ${{ runner.temp }}/DeFlow-*
          if-no-files-found: warn
          retention-days: 7

  browser-e2e:
    # Held back with the `test` job above; re-enabled the same way.
    if: vars.RUN_TESTS_IN_CI == 'true'
    # Linux only — do not triple macOS minutes on a browser job. Nothing in the
    # web or e2e slices is platform-specific; the platform-specific surface is
    # git worktrees and child processes, which the `test` matrix covers.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Explicit, because pnpm-workspace.yaml sets `allowBuilds: playwright:
      # false` — ~150 MB of browsers must never download on every install on
      # machines that only ever run the unit slice.
      #
      # `--filter @DeFlow/web` is not decoration: playwright is a dependency of
      # packages/web, and `pnpm exec` resolves against the .bin directory of the
      # package it runs in. At the root it only ever resolved on a machine with
      # a stale shim left by an earlier install — on a clean --frozen-lockfile
      # checkout it is "Command not found" (measured: run 30914294996).
      - run: pnpm --filter @DeFlow/web exec playwright install --with-deps chromium
      - run: pnpm vitest run --project web --project e2e
