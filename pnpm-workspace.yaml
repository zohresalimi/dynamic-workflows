packages:
  - packages/*
  - e2e

# NF6: nothing in this workspace may ever compile at install time. pnpm 11 asks
# for a decision per package that ships a binding.gyp; better-sqlite3@13.0.2 has
# gypfile:false, no install script and ships prebuilds/, so the answer is no —
# stated here so a future dependency cannot start compiling without a visible diff.
allowBuilds:
  better-sqlite3: false
  # playwright's install script downloads ~150 MB of browser binaries. The web
  # slice needs a real Chromium, but it is fetched explicitly by
  # "pnpm exec playwright install --with-deps chromium" in the browser CI job
  # (docs/14-testing-strategy.md §14) — never silently, on every install, on
  # machines that will only ever run the unit slice.
  playwright: false
  # lefthook's postinstall runs "lefthook install" for you. It compiles nothing,
  # but it writes into .git/hooks as a side effect of installing a dependency,
  # which is a surprising place for an install to reach. The root "prepare"
  # script does the same job explicitly, one line further down the same install,
  # so the implicit one is off.
  lefthook: false
  # Transitive, via reka-ui's @floating-ui/vue and @vue-flow/core's @vueuse/core.
  # Its postinstall compiles nothing — it copies one of lib/v2, lib/v2.7 or
  # lib/v3 over lib/index.mjs to bridge Vue 2 and 3. The published lib/index.mjs
  # is already the Vue 3 shim (`isVue3 = true`, re-exporting `vue`), and this
  # workspace only ever has Vue 3, so the script has nothing to do and the only
  # thing skipping it removes is an install-time write into node_modules.
  vue-demi: false

# One place, so nine packages cannot drift (docs/16-repo-layout.md §5).
# Consume every entry as "catalog:" — never a literal version in a package.json.
catalog:
  typescript: 6.0.3 # D3 — NOT 7.x: 7.x ships only bin/tsc, so vue-tsc cannot run
  vue-tsc: ^3.3.9 # embeds the TS6 compiler API; the reason typescript stays pinned at 6.0.3 (D3)
  zod: 4.4.3
  # KAR-02.8: the one JSON Schema 2020-12 validator this project ships. 2020-12 is the
  # dialect MCP tool `inputSchema` defaults to, and ajv arrives transitively via
  # @modelcontextprotocol/sdk anyway — pinned here so both users of it (the daemon at
  # runtime, packages/core/scripts at check time) compile the same bytes.
  ajv: 8.20.0
  ajv-formats: 3.0.1
  vitest: 4.1.10
  vite: 8.2.0
  "@types/node": ^24.0.0
  hono: 4.12.33
  "@hono/node-server": 2.0.12
  better-sqlite3: 13.0.2 # prebuilt N-API binaries, gypfile: false, no install script
  "@agentclientprotocol/sdk": 1.3.0 # exact: 0.4.5 -> 1.3.0 plus an npm-scope and org change in ~10 months
  "@modelcontextprotocol/sdk": 1.30.0
  execa: 10.0.1
  # KAR-09.7 Tier 2. Consumed **only** through the encoding-specific entrypoint
  # ("gpt-tokenizer/encoding/o200k_base"): the barrel pulls every BPE table into
  # the daemon for no accuracy gain, and packages/daemon/test/token-entrypoint.test.ts
  # is what stops the barrel creeping back in. Pure JS, no wasm, no native build (NF6).
  gpt-tokenizer: ^3.4.0
  # KAR-10.3. The RFC 6902 differ behind `spec.amended` — and, later, behind the
  # plan-evolution scrubber (docs/11-api-and-realtime.md §7.4), which is why the
  # two histories render through one component. `rfc6902`, never
  # `fast-json-patch`: that package last shipped in 2022 (docs/02 §4).
  rfc6902: ^5.3.0
  # KAR-15.2 AC8. The SSE client, and the reason the bearer token can be a
  # header at all: native `EventSource` has no mechanism for one, so a design
  # built on it forces the token into the query string — into shell history,
  # browser history, `Referer` headers and every access log anyone ever adds
  # (docs/02 §4, docs/11 §8.1). `fetch` + WebStreams, arbitrary headers,
  # `initialLastEventId`, and it runs in Node as well as the browser, which is
  # what lets one connector serve the UI and a CLI.
  eventsource-client: ^1.2.0
  pino: 10.3.1
  "@biomejs/biome": 2.5.6 # exact: a patch bump that reflows the repo makes the next commit unreviewable
  oxlint: 1.76.0
  oxlint-tsgolint: ^7.0.2001 # the type-aware engine "--type-aware" spawns; peerDependency of oxlint
  tsdown: 0.22.14 # exact: still 0.x
  # KAR-18.5 — the two package-shape linters `pnpm pack:check` runs against the
  # built package, both pinned exact because a gate that changes what it accepts
  # between two runs of the same release script is not a gate. `publint` reads
  # the manifest the way npm and every bundler will (files, bin, exports,
  # extensions); `attw` resolves each entry point the way each of the six module
  # resolution modes will, which is the half that catches a masked entry point
  # `pnpm dev` never exercises.
  publint: 0.3.22
  "@arethetypeswrong/cli": 0.18.5
  "@lydell/node-pty": 1.2.0-beta.14 # per-platform optionalDependencies; never node-gyp
  yaml: 2.9.0
  lefthook: ^2.1.10 # replaces husky *and* lint-staged; one Go binary via optionalDependencies
  vue: ~3.5.40 # tilde, deliberately: 3.6 rewrites the reactivity core and @vue-flow/core has not named it
  "@vitejs/plugin-vue": ^6.0.8 # peers vite ^8
  pino-pretty: ^13.1.3 # dev-only pipe ("pnpm dev | pino-pretty"), never a runtime transport
  "@types/better-sqlite3": ^9.6.0 # better-sqlite3@13 ships no types of its own
  # KAR-08.5 / D12. DeFlow does not build a sandbox; the vendor CLI enforces
  # one. This is the single narrow exception: Anthropic's standalone extraction
  # of the same Seatbelt/bubblewrap machinery, used to wrap the CLIs that ship
  # no sandbox of their own (Gemini, Copilot, Cursor, OpenCode) — never as a
  # second layer around one that has one. It is **0.0.x**, its API is treated
  # as unstable, and it is pinned exact with no range operator so that a patch
  # release cannot change the config schema under a policy nobody re-read.
  "@anthropic-ai/sandbox-runtime": 0.0.67
  # The web slice (docs/14-testing-strategy.md §13). Browser mode is stable in
  # Vitest 4; the three @vitest/* versions must move together with vitest itself.
  "@vitest/browser": 4.1.10
  "@vitest/browser-playwright": 4.1.10
  playwright: 1.62.1
  vitest-browser-vue: 2.1.0
  # KAR-16.1 — the application shell (docs/12-frontend-architecture.md §2, §8, §9).
  #
  # `vue-router@5` is a non-breaking transition release: it merged
  # unplugin-vue-router into core, and coming from v4 without that plugin it is
  # a version bump only. Plain object routes, never file-based — roughly ten
  # routes do not pay for a filesystem convention.
  vue-router: ^5.2.0
  # Pinia 4 stopped bundling @vue/devtools-api. Installing pinia without it does
  # not fail; devtools simply go quiet, which is a bad way to find out.
  pinia: ^4.0.2
  "@vue/devtools-api": ^8.2.1
  # KAR-16.4 AC10. The *query* half of the state split (docs/12 §3.4): if the
  # answer changes because an event was appended it is a projection, and if it
  # changes because a file on disk changed it is a query. Colada owns the
  # second kind only — `/api/providers`, `/api/config`, `/api/artifacts/:sha` —
  # and `test/ui-foundation.test.ts` is the rule that keeps run state out of it.
  "@pinia/colada": ^1.4.2
  # `useDark()` — the whole of dark mode: it flips `.dark` on <html>, seeds from
  # the OS `prefers-color-scheme` on first load and persists an explicit
  # override. The seven `--state-*` tokens are redefined under that one class.
  "@vueuse/core": ^14.4.0
  # 1.48.2 is the release whose a11y surface docs/12 §9.3 verified in the
  # bundle (aria-live, per-node ariaLabel, keyboard traversal). It is 345 KB raw
  # and deliberately IN the initial chunk: the plan graph is the landing view.
  "@vue-flow/core": ^1.48.2
  # KAR-17.1 AC9's two: a minimap and zoom controls, both named by docs/12 §6.1.
  # They are addons over `@vue-flow/core`'s own store rather than second
  # renderers — each is a few KB and neither is reachable from a view, because
  # `packages/web/scripts/check-graph-facade.ts` guards the whole `@vue-flow/`
  # scope and not only the core package.
  "@vue-flow/controls": ^1.1.3
  "@vue-flow/minimap": ^1.5.4
  # KAR-16.6 / KAR-00.4. The layout engine, exact rather than caret: 0.12.0 is
  # the build S3 settled — `elkjs/lib/elk-worker.min.js?worker` plus ELK's
  # `workerFactory`, never the documented `workerUrl`, which wants a publicly
  # served path that `vite build`'s hashing destroys (docs/spikes/S3-elk-worker.md).
  # It is GWT-transpiled Java, its own README acknowledges bundler friction, and
  # a floating range would move the 1.4 MB worker chunk under a recipe verified
  # against one build.
  elkjs: 0.12.0
  # Tailwind 4 is CSS-first: no tailwind.config.js and no PostCSS step, so the
  # Vite plugin is the whole integration and `@theme` lives in a stylesheet.
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  # `reka-ui`, never `radix-vue@1.9.17` — that is the dead name (docs/12 §8).
  # It is what the vendored shadcn-vue components sit on, and it is where the
  # genuinely hard half of overlay a11y comes from: focus trap, roving
  # tabindex, aria-expanded/controls, escape and outside-click.
  reka-ui: ^2.10.1
  # Glyphs. Every state chip is colour + glyph + text label (WCAG 1.4.1), and
  # the glyph half of that comes from here — per-icon imports, so the initial
  # chunk carries the handful actually rendered and not the set.
  lucide-vue-next: ^1.0.0
  # The two-line `cn()` the vendored components use to merge a caller's classes
  # over their own without a specificity war.
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  # KAR-17.3 AC4 — syntax highlighting, and the entrypoint matters more than the
  # version. **Never the bundled `shiki` entry**: it pulls every grammar and
  # every theme and costs multiple megabytes (docs/12 §7). `@shikijs/core`'s
  # `createHighlighterCore` takes the grammars it is given and nothing else, and
  # `@shikijs/engine-javascript` is what removes the WASM download — Oniguruma
  # is a 500 KB `.wasm` fetch the JavaScript engine does not need. The langs and
  # themes packages are consumed one deep import at a time
  # (`@shikijs/langs/typescript`), so the chunk carries the fourteen this
  # project highlights rather than the two hundred it does not. All four move
  # together: they share an internal grammar format with no compatibility
  # promise across minors.
  "@shikijs/core": 4.4.3
  "@shikijs/engine-javascript": 4.4.3
  "@shikijs/langs": 4.4.3
  "@shikijs/themes": 4.4.3
  # KAR-17.6 AC6 / F7.5 — token-level before/after on the surgical repair loop.
  # Part of the same family and pinned with it: it consumes `ThemedToken` and
  # `TokensResult` from the core above, and those are the types that move.
  "@shikijs/magic-move": 4.4.3
  # **Types only, and never imported.** `@shikijs/magic-move`'s `.d.mts` files
  # import `ThemedToken` from `shiki/core`, so the name has to resolve for
  # `vue-tsc` — but nothing in `packages/web/src` may import it, because this is
  # the bundled entry the block above forbids. `test/one-shiki-instance.test.ts`
  # is what keeps that true, and the runtime highlighter is
  # `packages/web/src/lib/highlighter.ts`'s single `createHighlighterCore`.
  shiki: 4.4.3
  # KAR-17.6 — the diff and review surface (docs/12 §6.7). Pinned **exactly,
  # with no caret**: it is pre-1.0, and a caret is how a minor bump silently
  # changes the surface an operator reviews a run on. Read the changelog before
  # bumping; `test/workspace-structure.test.ts` fails a range operator here.
  #
  # `@git-diff-view/core` parses the unified patch DeFlowd gets out of `git
  # diff`; `@git-diff-view/vue` is chosen over `diff2html@3.4.56` for one narrow
  # and decisive reason — first-class widget/extend slots **per line**, which is
  # what lets F7.7's verdicts be Vue components attached at `location.line`
  # rather than DOM surgery on a generated HTML string.
  #
  # `@git-diff-view/shiki@0.1.7` is the third package of that set and is
  # deliberately absent: it calls `createHighlighter` from the bundled `shiki`
  # entry with 34 grammars of its own, which is both the thing docs/12 §7
  # forbids and a *second* highlighter beside this app's shared one. Its only
  # real contract is the `DiffHighlighter` object shape, and `registerHighlighter`
  # takes ours — see `packages/web/src/lib/highlighter.ts`.
  "@git-diff-view/core": 0.1.7
  "@git-diff-view/vue": 0.1.7
  # KAR-17.3 AC11 — the **shape** half of d3 and deliberately not the rest.
  # `d3-shape`'s `line()` is a pure function from data to an SVG path string, so
  # a sparkline is a `<path :d>` in a Vue template and the DOM stays Vue's.
  # `d3-selection` is the half that owns the DOM itself, and a component that
  # imported it would have two frameworks writing the same subtree — which is
  # the bug `test/no-d3-selection-in-web.test.ts` exists to make impossible.
  d3-shape: ^3.2.0
  "@types/d3-shape": ^3.1.8
  # KAR-17.8 AC10 — the rest of the arithmetic half, for the run timeline.
  # `scaleTime` and `scaleBand` turn (ts, lane) into (x, y), `extent`/`max`
  # bound the domains and `timeFormat` labels the ticks. All four are pure
  # functions from data to numbers or strings; none of them touches the DOM.
  #
  # `d3-axis` is the one member of AC10's allowed set this app does not install,
  # and the reason is the rule directly above it: `axisBottom(scale)` is a
  # renderer that only knows how to run *against a d3 selection*, so importing
  # it would put `d3-selection` back in the bundle and a second owner back on
  # the subtree. The ticks a Vue template needs are `scale.ticks()` and
  # `scale.tickFormat()`, which are `d3-scale`'s and need no selection at all.
  d3-scale: ^4.0.2
  "@types/d3-scale": ^4.0.9
  d3-array: ^3.2.4
  "@types/d3-array": ^3.2.2
  d3-time-format: ^4.1.0
  "@types/d3-time-format": ^4.0.3
  # KAR-17.5 — the live agent output panel (docs/12-frontend-architecture.md §6.6).
  #
  # **`@xterm/xterm@6`, and only for the CLI-shim path.** The scope migration is
  # complete: unscoped `xterm` is frozen at 5.3.0 (2023-09-07) and the PRD's
  # package name is stale. v6 removed `@xterm/addon-canvas` entirely, so the
  # renderer is DOM or WebGL and nothing else — which is why `addon-webgl` is
  # here with a DOM fallback wired to its `onContextLoss`, and why no canvas
  # addon appears below. Re-verified against the real 6.0.0 tarball on
  # 2026-08-11 (A3-8 records that the v6 changelog was previously read through a
  # summarizer that got the release date wrong): `BufferLine`'s constructor is
  # `new Uint32Array(cols * CELL_SIZE)` with `CELL_SIZE = 3`, i.e. **12 bytes
  # per cell**, which is the arithmetic behind `TERMINAL_SCROLLBACK` in
  # `packages/web/src/lib/terminal-session.ts` and must not be raised.
  #
  # `addon-serialize` is not a nicety: it is the whole dispose discipline. One
  # `Terminal` per *visible* terminal means a closing panel serialises to a
  # string and disposes, and browsers cap WebGL contexts at roughly 8–16 with a
  # silent failure in the *oldest* terminal when you go over.
  "@xterm/xterm": ^6.0.0
  "@xterm/addon-fit": ^0.11.0
  "@xterm/addon-serialize": ^0.14.0
  "@xterm/addon-webgl": ^0.19.0
  # KAR-17.5 AC2 — incremental highlighting for the ACP path, and a member of
  # the Shiki family above, so it is pinned exactly with them: it consumes
  # `HighlighterCore` and `ThemedToken` from `@shikijs/core`, and those are the
  # types that move across a minor. `ShikiStreamTokenizer.enqueue(chunk)`
  # re-tokenises only the trailing unstable region and returns
  # `{recall, stable, unstable}` — which is what makes a 2,000-chunk stream cost
  # per-chunk time that does not grow with the buffer. It is fed by the app's
  # one highlighter (docs/12 §7); it never constructs a second.
  "@shikijs/stream": 4.4.3
  # KAR-17.5 AC1/AC7 — the virtualiser behind both the typed ACP message list
  # and the read-only archive viewer. Headless: it computes offsets and returns
  # the window, and the DOM stays Vue's — the same rule that keeps `d3-selection`
  # out of this package. It is what lets "Open full log" hold a 400 MB artifact
  # as a line index plus a handful of byte-range fetches instead of a buffer.
  "@tanstack/vue-virtual": ^3.13.35
